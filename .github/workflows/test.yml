name: tests

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax check the runtime files
        run: |
          for f in constants.js content.js background.js popup.js; do
            node --check "$f"
          done

      - name: Unit tests
        run: node --test tests/*.test.cjs

      - name: Build the store package and verify its contents
        run: node scripts/package.mjs --verify
